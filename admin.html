<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>社内レンタル予約 | 管理画面</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- FullCalendarのCSS & JS (CDN) -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .header { background-color: #333; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .back-link { color: white; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        
        .main-container { padding: 2rem; max-width: 1400px; margin: 0 auto; }
        
        .tab-menu { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .tab-btn { background-color: #e2e8f0; color: #475569; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background-color 0.2s, color 0.2s; }
        .tab-btn.active { background-color: #206c8c; color: white; }
        .tab-btn:hover { background-color: #cbd5e1; }
        .tab-btn.active:hover { background-color: #174d63; }

        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .card { background-color: white; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 2rem; overflow-x: auto; margin-bottom: 2rem; }
        .card h2 { margin-top: 0; font-size: 1.2rem; color: #206c8c; border-bottom: 2px solid #f0f2f5; padding-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        
        /* カレンダー固有のスタイル調整 */
        #calendar { max-width: 100%; margin: 0 auto; background: #fff; padding: 0.5rem; border-radius: 0.8rem; }
        .fc-event { cursor: pointer; font-size: 0.85rem; padding: 2px 4px; border-radius: 4px; }

        /* FullCalendar内部のtableには管理一覧用のmin-width:1100pxを適用しない */
        .fc table { width: 100% !important; min-width: 0 !important; table-layout: fixed; }
        .fc .fc-scrollgrid,
        .fc .fc-scrollgrid-section table,
        .fc .fc-col-header,
        .fc .fc-daygrid-body,
        .fc .fc-daygrid-body table { width: 100% !important; min-width: 0 !important; }
        .fc .fc-view-harness,
        .fc .fc-view-harness-active { width: 100% !important; max-width: 100% !important; }

        .filter-menu { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn { background-color: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 0.3rem 0.8rem; border-radius: 0.4rem; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .filter-btn.active { background-color: #206c8c; color: white; border-color: #206c8c; }
        .filter-btn:hover { background-color: #e2e8f0; }


        /* --- 本日の運用サマリー --- */
        .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .summary-card { border: 1px solid #e2e8f0; background: white; border-radius: 1rem; padding: 1.25rem 1.4rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; text-align: left; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
        .summary-card:hover { transform: translateY(-2px); box-shadow: 0 7px 14px rgba(0,0,0,0.08); }
        .summary-card.active { border-color: #206c8c; box-shadow: 0 0 0 3px rgba(32,108,140,0.12); }
        .summary-card.overdue.active { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.12); }
        .summary-label { display: flex; align-items: center; gap: 0.45rem; color: #475569; font-size: 0.9rem; font-weight: bold; }
        .summary-count { margin-top: 0.5rem; font-size: 2rem; line-height: 1; font-weight: 800; color: #206c8c; }
        .summary-card.return .summary-count { color: #0284c7; }
        .summary-card.overdue .summary-count { color: #dc2626; }
        .summary-note { margin-top: 0.55rem; color: #64748b; font-size: 0.78rem; }
        .summary-card.overdue .summary-note { color: #b91c1c; }

        @media (max-width: 760px) {
            .summary-grid { grid-template-columns: 1fr; }
            .main-container { padding: 1rem; }
        }

        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: #f7f9fa; color: #206c8c; font-weight: bold; }
        
        select { padding: 0.4rem; border-radius: 0.4rem; border: 1px solid #ccc; font-family: inherit; cursor: pointer; }
        .status-yoyaku { background-color: #fff9c4; }
        .status-kashidashi { background-color: #c8e6c9; }
        .status-henkyaku { background-color: #e0e0e0; }
        
        .item-list { margin: 0; padding-left: 1.2rem; font-size: 0.9rem; }
        .item-list li { margin-bottom: 0.6rem; }
        
        /* 予約一覧での個体選択エリアのスタイル */
        .item-unit-assign { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; flex-wrap: wrap; }
        .unit-select { padding: 0.3rem; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 0.3rem; background: #fff; }
        .unit-assign-btn { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 0.25rem 0.6rem; border-radius: 0.3rem; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s ease; }
        .unit-assign-btn:hover { background-color: #bae6fd; }

        .table-input { width: 100%; padding: 0.4rem; border: 1px solid #ccc; border-radius: 0.3rem; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; }
        .table-select { width: 100%; padding: 0.4rem; border: 1px solid #ccc; border-radius: 0.3rem; font-family: inherit; font-size: 0.9rem; background-color: white; cursor: pointer; }

        .action-btns { display: flex; gap: 0.5rem; }
        .save-btn { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 0.4rem 0.8rem; border-radius: 0.4rem; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .save-btn:hover { background-color: #bae6fd; }

        .delete-btn { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; padding: 0.4rem 0.8rem; border-radius: 0.4rem; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .delete-btn:hover { background-color: #ffcdd2; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 0.3rem; color: #555; white-space: nowrap; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 0.4rem; font-family: inherit; box-sizing: border-box; background-color: #fff; }
        .form-group input[type="file"] { padding: 0.4rem; background-color: #f9f9f9; cursor: pointer; }
        .submit-btn { background-color: #206c8c; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.4rem; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #174d63; }

        .product-thumbnail { width: 50px; height: 50px; object-fit: cover; border-radius: 0.3rem; background-color: #eee; display: block; margin-bottom: 0.3rem; }

        /* --- カスタム確認モーダル（ポップアップ）のスタイル --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; box-sizing: border-box; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 1.5rem; max-width: 450px; width: 100%; padding: 2rem; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; animation: modalOpen 0.2s ease-out; }
        
        @keyframes modalOpen {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h3 { font-size: 1.3rem; color: #206c8c; margin-top: 0; margin-bottom: 1rem; }
        .modal-content p { color: #555; font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .modal-btn-group { display: flex; gap: 1rem; justify-content: center; }
        .modal-cancel-btn { background-color: #e2e8f0; color: #475569; border: none; padding: 0.7rem 1.5rem; border-radius: 1rem; font-size: 0.95rem; font-weight: bold; cursor: pointer; flex: 1; }
        .modal-cancel-btn:hover { background-color: #cbd5e1; }
        .modal-confirm-btn { background-color: #dc2626; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 1rem; font-size: 0.95rem; font-weight: bold; cursor: pointer; flex: 1; }
        .modal-confirm-btn:hover { background-color: #b91c1c; }

        /* --- スマホ・タブレット向け管理画面 --- */
        @media (max-width: 900px) {
            .header { padding: 0.8rem 1rem; gap: 0.75rem; }
            .header h1 { font-size: 1.05rem; }
            .back-link { font-size: 0.8rem; white-space: nowrap; }

            .main-container { padding: 1rem; }

            .tab-menu {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.6rem;
                margin-bottom: 1rem;
            }
            .tab-btn {
                width: 100%;
                padding: 0.8rem 0.55rem;
                font-size: 0.9rem;
                line-height: 1.35;
            }

            .card {
                padding: 1rem;
                border-radius: 0.8rem;
                margin-bottom: 1rem;
                overflow-x: hidden;
            }
            .card h2 {
                font-size: 1rem;
                display: block;
                line-height: 1.45;
            }

            /* FullCalendarを縦並びにしてはみ出しを防止 */
            #calendar { padding: 0; width: 100%; max-width: 100%; overflow: hidden; }
            .fc { width: 100% !important; max-width: 100% !important; }
            .fc .fc-scrollgrid { font-size: 0.82rem; }
            .fc .fc-daygrid-day-frame { min-width: 0; }
            .fc .fc-daygrid-event {
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
                max-width: 100%;
            }
            .fc .fc-event-title,
            .fc .fc-event-time {
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }
            .fc .fc-toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.65rem;
            }
            .fc .fc-toolbar-chunk {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.25rem;
            }
            .fc .fc-toolbar-title {
                font-size: 1.35rem !important;
                text-align: center;
            }
            .fc .fc-button {
                font-size: 0.78rem !important;
                padding: 0.45rem 0.6rem !important;
            }
            .fc .fc-col-header-cell-cushion,
            .fc .fc-daygrid-day-number {
                font-size: 0.78rem;
            }
            .fc-event {
                font-size: 0.7rem;
                padding: 1px 2px;
            }

            .summary-grid { grid-template-columns: 1fr; gap: 0.7rem; }
            .summary-card { padding: 1rem; }
            .summary-count { font-size: 1.65rem; }

            /* 予約一覧のフィルターを押しやすく */
            #reservation-table-card h2 .filter-menu {
                margin-top: 0.8rem;
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.45rem;
            }
            #reservation-table-card .filter-btn {
                width: 100%;
                padding: 0.55rem 0.35rem;
                font-size: 0.78rem;
            }

            /* 予約一覧は横長テーブルをやめ、1予約=1カードにする */
            #reservation-table-card table {
                min-width: 0;
                width: 100%;
                display: block;
            }
            #reservation-table-card thead { display: none; }
            #reservation-table-card tbody {
                display: flex;
                flex-direction: column;
                gap: 0.85rem;
                width: 100%;
            }
            #reservation-table-card tr {
                display: block;
                width: 100%;
                background: #fff;
                border: 1px solid #e2e8f0;
                border-radius: 0.85rem;
                padding: 0.35rem 0.85rem;
                box-sizing: border-box;
                box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            }
            #reservation-table-card td {
                display: grid;
                grid-template-columns: 7.2rem minmax(0, 1fr);
                gap: 0.65rem;
                align-items: start;
                width: 100%;
                padding: 0.7rem 0;
                border-bottom: 1px solid #eef2f7;
                box-sizing: border-box;
                overflow-wrap: anywhere;
            }
            #reservation-table-card td:last-child { border-bottom: none; }
            #reservation-table-card td::before {
                content: attr(data-label);
                color: #64748b;
                font-size: 0.78rem;
                font-weight: 700;
                line-height: 1.5;
            }
            #reservation-table-card td[colspan] {
                display: block;
                text-align: center !important;
                padding: 1rem 0;
            }
            #reservation-table-card td[colspan]::before { display: none; }
            #reservation-table-card td a { overflow-wrap: anywhere; }
            #reservation-table-card select { max-width: 100%; }
            #reservation-table-card .item-list { padding-left: 1rem; }
            #reservation-table-card .item-unit-assign { align-items: stretch; }
            #reservation-table-card .unit-select { max-width: 100%; }
            #reservation-table-card td:last-child > select {
                width: 100%;
                margin-bottom: 0.6rem;
                padding: 0.55rem;
            }
            #reservation-table-card td:last-child .delete-btn {
                width: 100%;
                padding: 0.65rem;
            }
        }

        @media (max-width: 520px) {
            .header { align-items: flex-start; }
            .header h1 { font-size: 0.95rem; }
            .back-link { font-size: 0.72rem; }
            .main-container { padding: 0.7rem; }

            #reservation-table-card h2 .filter-menu {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            #reservation-table-card td {
                grid-template-columns: 5.8rem minmax(0, 1fr);
                gap: 0.5rem;
                font-size: 0.88rem;
            }

            .fc .fc-toolbar-title { font-size: 1.05rem !important; }
            .fc .fc-button { font-size: 0.72rem !important; padding: 0.38rem 0.5rem !important; }
            .fc .fc-col-header-cell-cushion,
            .fc .fc-daygrid-day-number { font-size: 0.72rem; padding-left: 2px; padding-right: 2px; }
            .fc .fc-daygrid-day-frame { min-height: 4.2rem; }
            .fc-event { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>レンタル管理ダッシュボード</h1>
        <a href="index.html" class="back-link">トップページに戻る</a>
    </div>

    <div class="main-container">
        <div class="tab-menu">
            <button class="tab-btn active" id="btn-reservations" onclick="switchTab('reservations', this)">📋 予約一覧・管理</button>
            <button class="tab-btn" id="btn-products" onclick="switchTab('products', this)">📦 商品一覧・新規追加</button>
        </div>

        <div id="section-reservations" class="admin-section active">
            <!-- 予約日程カレンダー表示用カード -->
            <div class="card">
                <h2>📅 予約スケジュール カレンダー</h2>
                <div id="calendar"></div>
            </div>

            <div class="summary-grid" aria-label="本日の運用サマリー">
                <button type="button" class="summary-card lending" id="summary-lending" onclick="applyQuickFilter('today-lending', this)">
                    <div class="summary-label">📦 本日の貸出</div>
                    <div class="summary-count"><span id="count-today-lending">0</span><span style="font-size:1rem; margin-left:0.2rem;">件</span></div>
                    <div class="summary-note">今日から利用開始・予約中</div>
                </button>
                <button type="button" class="summary-card return" id="summary-return" onclick="applyQuickFilter('today-return', this)">
                    <div class="summary-label">↩️ 本日の返却</div>
                    <div class="summary-count"><span id="count-today-return">0</span><span style="font-size:1rem; margin-left:0.2rem;">件</span></div>
                    <div class="summary-note">今日が返却日・貸出中</div>
                </button>
                <button type="button" class="summary-card overdue" id="summary-overdue" onclick="applyQuickFilter('overdue', this)">
                    <div class="summary-label">⚠️ 返却期限超過</div>
                    <div class="summary-count"><span id="count-overdue">0</span><span style="font-size:1rem; margin-left:0.2rem;">件</span></div>
                    <div class="summary-note">返却日を過ぎても貸出中</div>
                </button>
            </div>

            <div class="card" id="reservation-table-card">
                <h2>
                    📋 予約・貸出管理一覧
                    <div class="filter-menu">
                        <button class="filter-btn active" onclick="filterReservations('all', this)">すべて</button>
                        <button class="filter-btn" onclick="filterReservations('予約中', this)">予約中</button>
                        <button class="filter-btn" onclick="filterReservations('貸出中', this)">貸出中</button>
                        <button class="filter-btn" onclick="filterReservations('返却済', this)">返却済</button>
                        <button class="filter-btn" onclick="filterReservations('キャンセル', this)">キャンセル</button>
                    </div>
                </h2>
                <table>
                    <thead>
                        <tr>
                            <th>申込日時</th>
                            <th>所属</th>
                            <th>氏名</th>
                            <th>予約商品 ＆ 個体番号割当</th>
                            <th>レンタル期間</th>
                            <th>メールアドレス</th>
                            <th>ステータス / 操作</th>
                        </tr>
                    </thead>
                    <tbody id="reservation-list">
                        <tr>
                            <td colspan="7" style="text-align: center;">データを読み込んでいます...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="section-products" class="admin-section">
            <div class="card">
                <h2>➕ 新規レンタル品の追加（画像アップロード対応）</h2>
                <form id="add-item-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="product-name">商品名</label>
                            <input type="text" id="product-name" required placeholder="例: テント">
                        </div>
                        <div class="form-group">
                            <label for="product-category">カテゴリ</label>
                            <select id="product-category" required>
                                <option value="" disabled selected>選択してください</option>
                                <option value="スポーツ">スポーツ</option>
                                <option value="アウトドア">アウトドア</option>
                                <option value="トラベル">トラベル</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="total-stock">総在庫数 (数値)</label>
                            <input type="number" id="total-stock" required min="1" value="1">
                        </div>
                        <div class="form-group">
                            <label for="unit-numbers">個体番号（カンマ区切り / 数量管理は空欄）</label>
                            <input type="text" id="unit-numbers" placeholder="例: No.1, No.2 (数量管理なら空欄)">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="product-image">商品画像ファイル（任意）</label>
                            <input type="file" id="product-image" accept="image/*">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">この内容でアイテムを追加する</button>
                </form>
            </div>

            <div class="card">
                <h2>
                    📦 登録済み商品一覧（公開・非表示切替対応）
                    <div class="filter-menu">
                        <button class="filter-btn active" onclick="filterProducts('all', this)">すべて</button>
                        <button class="filter-btn" onclick="filterProducts('スポーツ', this)">スポーツ</button>
                        <button class="filter-btn" onclick="filterProducts('アウトドア', this)">アウトドア</button>
                        <button class="filter-btn" onclick="filterProducts('トラベル', this)">トラベル</button>
                        <button class="filter-btn" onclick="filterProducts('その他', this)">その他</button>
                    </div>
                </h2>
                <table>
                    <thead>
                        <tr>
                            <th>画像 / 変更</th>
                            <th>商品名</th>
                            <th>カテゴリ</th>
                            <th>在庫数</th>
                            <th>公開状態</th>
                            <th>個体番号一覧 (カンマ区切り)</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <tr>
                            <td colspan="7" style="text-align: center;">商品を読み込んでいます...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- カスタム確認モーダル -->
    <div class="modal-overlay" id="custom-confirm-modal">
        <div class="modal-content">
            <h3 id="modal-title">確認</h3>
            <p id="modal-message">本当に実行しますか？</p>
            <div class="modal-btn-group">
                <button class="modal-cancel-btn" onclick="closeCustomConfirm(false)">キャンセル</button>
                <button class="modal-confirm-btn" id="modal-submit-btn" onclick="closeCustomConfirm(true)">削除する</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://byntbjxaozwrdexvdlwb.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_HA3bsshsYRxlyVJXjdjOGQ_Jhyuv-4S';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJsSingleQuoted(value) {
            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');
        }

        function safeImageUrl(value) {
            if (!value) return '';
            try {
                const url = new URL(String(value), window.location.href);
                return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : '';
            } catch {
                return '';
            }
        }

        let allReservationsData = [];
        let allResItemsData = [];
        let allProductsData = [];
        let allUnitsData = [];
        let currentStatusFilter = 'all';
        let currentQuickFilter = null;
        let currentCategoryFilter = 'all';
        let calendar = null; // FullCalendarインスタンス
        let confirmCallback = null; // 確認モーダルのコールバック関数

        window.addEventListener('DOMContentLoaded', () => {
            const savedTab = localStorage.getItem('admin_active_tab') || 'reservations';
            const targetBtn = savedTab === 'products' ? document.getElementById('btn-products') : document.getElementById('btn-reservations');
            switchTab(savedTab, targetBtn);

            // カレンダーの初期化
            initCalendar();

            loadReservations();
            loadProducts();
        });

        // カスタム確認モーダルを表示する関数 (Promiseで返す)
        function showCustomConfirm(title, message, confirmText = "削除する") {
            return new Promise((resolve) => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                document.getElementById('modal-submit-btn').innerText = confirmText;
                document.getElementById('custom-confirm-modal').classList.add('active');
                confirmCallback = resolve;
            });
        }

        function closeCustomConfirm(result) {
            document.getElementById('custom-confirm-modal').classList.remove('active');
            if (confirmCallback) {
                confirmCallback(result);
                confirmCallback = null;
            }
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                buttonText: {
                    today: '今日',
                    month: '月',
                    week: '週'
                },
                height: 'auto',
                events: [],
                eventClick: function(info) {
                    alert(info.event.title + "\n\n" + (info.event.extendedProps.description || ''));
                }
            });
            calendar.render();
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'reservations') {
                document.getElementById('section-reservations').classList.add('active');
                setTimeout(() => { if(calendar) calendar.updateSize(); }, 100);
            } else if (tabName === 'products') {
                document.getElementById('section-products').classList.add('active');
            }
            if (btnElement) btnElement.classList.add('active');
            localStorage.setItem('admin_active_tab', tabName);
        }

        async function loadReservations() {
            const tbody = document.getElementById('reservation-list');
            try {
                const { data: reservations, error: resError } = await supabaseClient.from('reservations').select('*').order('id', { ascending: false });
                const { data: resItems, error: itemsError } = await supabaseClient.from('reservation_items').select('*');
                const { data: products, error: prodError } = await supabaseClient.from('products').select('*');
                const { data: units, error: unitError } = await supabaseClient.from('product_units').select('*');

                if (resError) throw resError;
                if (itemsError) throw itemsError;
                if (prodError) throw prodError;
                if (unitError) throw unitError;

                allReservationsData = reservations || [];
                allResItemsData = resItems || [];
                allProductsData = products || [];
                allUnitsData = units || [];

                updateSummaryCards();
                renderReservationList();
                updateCalendarEvents();
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">エラーが発生しました: ${escapeHtml(err.message)}</td></tr>`;
            }
        }

        function updateCalendarEvents() {
            if (!calendar) return;

            const events = [];
            allReservationsData.forEach(res => {
                if (res.status === 'キャンセル') return;

                let endDateObj = new Date(res.end_date);
                endDateObj.setDate(endDateObj.getDate() + 1);
                const adjustedEndDate = endDateObj.toISOString().split('T')[0];

                const myItems = allResItemsData.filter(item => item.reservation_id === res.id);
                const productNames = myItems.map(item => {
                    const product = allProductsData.find(p => p.id === item.product_id);
                    return product ? product.name : '商品';
                });
                const summaryText = `${res.user_name} (${res.department}): ${productNames.join(', ')}`;

                let bgColor = '#206c8c';
                if (res.status === '貸出中') bgColor = '#0284c7';
                if (res.status === '返却済') bgColor = '#64748b';

                events.push({
                    title: summaryText,
                    start: res.start_date,
                    end: adjustedEndDate,
                    backgroundColor: bgColor,
                    borderColor: bgColor,
                    extendedProps: {
                        description: `申込者: ${res.user_name} (${res.department})\n期間: ${res.start_date} 〜 ${res.end_date}\nステータス: ${res.status}\nメール: ${res.email}`
                    }
                });
            });

            calendar.removeAllEvents();
            calendar.addEventSource(events);
        }

        function getLocalDateString(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function updateSummaryCards() {
            const today = getLocalDateString();
            const todayLending = allReservationsData.filter(res => (res.status || '予約中') === '予約中' && res.start_date === today).length;
            const todayReturn = allReservationsData.filter(res => res.status === '貸出中' && res.end_date === today).length;
            const overdue = allReservationsData.filter(res => res.status === '貸出中' && res.end_date && res.end_date < today).length;

            document.getElementById('count-today-lending').textContent = todayLending;
            document.getElementById('count-today-return').textContent = todayReturn;
            document.getElementById('count-overdue').textContent = overdue;
        }

        function clearQuickFilterAppearance() {
            document.querySelectorAll('.summary-card').forEach(card => card.classList.remove('active'));
        }

        function applyQuickFilter(filterName, cardElement) {
            // 選択中のカードをもう一度押したらフィルター解除
            if (currentQuickFilter === filterName) {
                currentQuickFilter = null;
                currentStatusFilter = 'all';
                clearQuickFilterAppearance();

                const filterButtons = document.querySelectorAll('#section-reservations .filter-btn');
                filterButtons.forEach(btn => btn.classList.remove('active'));
                if (filterButtons.length > 0) filterButtons[0].classList.add('active');

                renderReservationList();
                return;
            }

            currentQuickFilter = filterName;
            currentStatusFilter = 'all';

            document.querySelectorAll('#section-reservations .filter-btn').forEach(btn => btn.classList.remove('active'));
            clearQuickFilterAppearance();
            if (cardElement) cardElement.classList.add('active');

            renderReservationList();
            document.getElementById('reservation-table-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function filterReservations(status, btnElement) {
            currentStatusFilter = status;
            currentQuickFilter = null;
            clearQuickFilterAppearance();
            document.querySelectorAll('#section-reservations .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderReservationList();
        }

        function renderReservationList() {
            const tbody = document.getElementById('reservation-list');
            const today = getLocalDateString();
            const filteredReservations = allReservationsData.filter(res => {
                const status = res.status || '予約中';

                if (currentQuickFilter === 'today-lending') {
                    return status === '予約中' && res.start_date === today;
                }
                if (currentQuickFilter === 'today-return') {
                    return status === '貸出中' && res.end_date === today;
                }
                if (currentQuickFilter === 'overdue') {
                    return status === '貸出中' && res.end_date && res.end_date < today;
                }

                if (currentStatusFilter === 'all') return true;
                return status === currentStatusFilter;
            });

            if (filteredReservations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">該当する予約はありません。</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            filteredReservations.forEach(res => {
                const tr = document.createElement('tr');
                const createdAt = res.created_at ? new Date(res.created_at).toLocaleString('ja-JP') : '不明';
                const currentStatus = res.status || '予約中';
                const safeResId = escapeJsSingleQuoted(res.id);
                const safeDepartment = escapeHtml(res.department);
                const safeUserName = escapeHtml(res.user_name);
                const safeStartDate = escapeHtml(res.start_date);
                const safeEndDate = escapeHtml(res.end_date);
                const safeEmail = escapeHtml(res.email);
                const safeEmailHref = encodeURIComponent(String(res.email || '').trim());
                const myItems = allResItemsData.filter(item => item.reservation_id === res.id);
                
                // この予約期間と被る他の有効な予約ID（キャンセル・返却済以外、自予約は除く）
                const conflictingResIds = allReservationsData.filter(r => r.id !== res.id && r.status !== 'キャンセル' && r.status !== '返却済' && !(r.end_date < res.start_date || r.start_date > res.end_date)).map(r => r.id);
                // その期間に既に予約・貸出されているunit_idのリスト
                const bookedUnitIds = allResItemsData.filter(i => conflictingResIds.includes(i.reservation_id) && i.unit_id).map(i => i.unit_id);

                // reservation_itemsごとにHTMLを生成する
                let itemsHtml = '<ul class="item-list">';
                myItems.forEach(item => {
                    const product = allProductsData.find(p => p.id === item.product_id);
                    const productName = product ? product.name : '不明な商品';
                    const safeProductName = escapeHtml(productName);
                    const safeItemId = escapeJsSingleQuoted(item.id);
                    const prodUnits = allUnitsData.filter(u => u.product_id === item.product_id);

                    if (prodUnits.length > 0) {
                        let unitOptions = `<option value="">-- 個体を選択 --</option>`;
                        prodUnits.forEach(u => {
                            const isBooked = bookedUnitIds.includes(u.id);
                            const isCurrent = item.unit_id === u.id;
                            if (!isBooked || isCurrent) {
                                const selected = isCurrent ? 'selected' : '';
                                unitOptions += `<option value="${u.id}" ${selected}>${escapeHtml(u.unit_number)}</option>`;
                            }
                        });

                        itemsHtml += `
                            <li>
                                <strong>${safeProductName}</strong>
                                <div class="item-unit-assign">
                                    <select id="unit-select-${escapeHtml(item.id)}" class="unit-select">
                                        ${unitOptions}
                                    </select>
                                    <button class="unit-assign-btn" onclick="updateItemUnit(this, '${safeItemId}')">個体変更</button>
                                </div>
                            </li>
                        `;
                    } else {
                        itemsHtml += `<li><strong>${safeProductName}</strong> (${item.quantity}個)</li>`;
                    }
                });
                itemsHtml += '</ul>';

                tr.innerHTML = `
                    <td data-label="申込日時" style="font-size: 0.9rem; color: #666;">${createdAt}</td>
                    <td data-label="所属">${safeDepartment}</td>
                    <td data-label="氏名"><strong>${safeUserName}</strong></td>
                    <td data-label="予約商品">${itemsHtml || '商品データなし'}</td>
                    <td data-label="レンタル期間">${safeStartDate} <br>〜 ${safeEndDate}</td>
                    <td data-label="メール"><a href="mailto:${safeEmailHref}" style="font-size: 0.9rem;">${safeEmail}</a></td>
                    <td data-label="ステータス / 操作">
                        <select onchange="updateStatus('${safeResId}', this.value)" class="${getStatusClass(currentStatus)}">
                            <option value="予約中" ${currentStatus === '予約中' ? 'selected' : ''}>予約中</option>
                            <option value="貸出中" ${currentStatus === '貸出中' ? 'selected' : ''}>貸出中</option>
                            <option value="返却済" ${currentStatus === '返却済' ? 'selected' : ''}>返却済</option>
                            <option value="キャンセル" ${currentStatus === 'キャンセル' ? 'selected' : ''}>キャンセル</option>
                        </select>
                        <button onclick="deleteReservation('${safeResId}')" class="delete-btn">予約を削除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 管理者が予約アイテムの個体番号を変更する処理（ポップアップなし・ボタン変化アニメーション仕様）
        async function updateItemUnit(btnElement, itemId) {
            const selectEl = document.getElementById(`unit-select-${itemId}`);
            const newUnitId = selectEl.value ? selectEl.value : null;

            try {
                const { error } = await supabaseClient
                    .from('reservation_items')
                    .update({ unit_id: newUnitId })
                    .eq('id', itemId);

                if (error) throw error;

                // ボタンの見た目を「変更しました！」（緑色）に一時的に変化させる
                const originalText = btnElement.innerText;
                const originalBg = btnElement.style.backgroundColor;
                const originalColor = btnElement.style.color;

                btnElement.innerText = "変更しました！";
                btnElement.style.backgroundColor = "#16a34a";
                btnElement.style.color = "white";
                btnElement.disabled = true;

                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.backgroundColor = originalBg;
                    btnElement.style.color = originalColor;
                    btnElement.disabled = false;
                    loadReservations();
                }, 1200);

            } catch (err) {
                console.error(err);
                alert("個体番号の変更に失敗しました。\n" + err.message);
                loadReservations();
            }
        }

        async function loadProducts() {
            try {
                const { data: products, error: prodError } = await supabaseClient.from('products').select('*').order('name');
                const { data: units, error: unitError } = await supabaseClient.from('product_units').select('*');
                if (prodError) throw prodError;
                if (unitError) throw unitError;

                allProductsData = products || [];
                allUnitsData = units || [];
                renderProductList();
            } catch (err) {
                console.error(err);
                document.getElementById('product-list').innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">エラーが発生しました: ${escapeHtml(err.message)}</td></tr>`;
            }
        }

        function filterProducts(category, btnElement) {
            currentCategoryFilter = category;
            document.querySelectorAll('#section-products .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderProductList();
        }

        function renderProductList() {
            const tbody = document.getElementById('product-list');
            const filteredProducts = allProductsData.filter(prod => {
                if (currentCategoryFilter === 'all') return true;
                return prod.category === currentCategoryFilter;
            });

            if (filteredProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">該当する商品はありません。</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            filteredProducts.forEach(prod => {
                const tr = document.createElement('tr');
                const safeImage = safeImageUrl(prod.image_url);
                const safeProdId = escapeJsSingleQuoted(prod.id);
                const safeProdName = escapeHtml(prod.name);
                const safeProdCategory = escapeHtml(prod.category);
                const safeImageAttr = escapeHtml(safeImage);
                const imgHtml = safeImage ? `<img src="${safeImageAttr}" class="product-thumbnail" alt="商品画像">` : '<span style="font-size:0.8rem; color:#999; display:block; margin-bottom:0.3rem;">画像なし</span>';
                const prodUnits = allUnitsData.filter(u => u.product_id === prod.id);
                const unitNumbersStr = prodUnits.map(u => u.unit_number).join(', ');
                const isActive = prod.is_active !== false;

                tr.innerHTML = `
                    <td>
                        ${imgHtml}
                        <input type="file" id="image-file-${prod.id}" accept="image/*" style="font-size: 0.75rem; width: 130px;">
                    </td>
                    <td><input type="text" id="name-${prod.id}" value="${safeProdName}" class="table-input"></td>
                    <td>
                        <select id="cat-${prod.id}" class="table-select">
                            <option value="スポーツ" ${prod.category === 'スポーツ' ? 'selected' : ''}>スポーツ</option>
                            <option value="アウトドア" ${prod.category === 'アウトドア' ? 'selected' : ''}>アウトドア</option>
                            <option value="トラベル" ${prod.category === 'トラベル' ? 'selected' : ''}>トラベル</option>
                            <option value="その他" ${prod.category === 'その他' ? 'selected' : ''}>その他</option>
                        </select>
                    </td>
                    <td><input type="number" id="stock-${prod.id}" value="${prod.total_stock || prodUnits.length}" min="1" class="table-input" style="width: 70px;"></td>
                    <td>
                        <select id="active-${prod.id}" class="table-select">
                            <option value="true" ${isActive ? 'selected' : ''}>🟢 公開中</option>
                            <option value="false" ${!isActive ? 'selected' : ''}>🔴 非表示（修理中等）</option>
                        </select>
                    </td>
                    <td><input type="text" id="units-${prod.id}" value="${escapeHtml(unitNumbersStr)}" class="table-input" placeholder="例: No.1, No.2"></td>
                    <td>
                        <div class="action-btns">
                            <button data-current-image-url="${safeImageAttr}" onclick="saveProduct(this, '${safeProdId}', this.dataset.currentImageUrl)" class="save-btn">変更を保存</button>
                            <button onclick="deleteProduct('${safeProdId}')" class="delete-btn">削除</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getStatusClass(status) {
            if (status === '予約中') return 'status-yoyaku';
            if (status === '貸出中') return 'status-kashidashi';
            if (status === '返却済') return 'status-henkyaku';
            return '';
        }

        async function updateStatus(reservationId, newStatus) {
            try {
                const { error } = await supabaseClient.from('reservations').update({ status: newStatus }).eq('id', reservationId);
                if (error) throw error;
                loadReservations(); 
            } catch (err) {
                console.error(err);
                alert("更新に失敗しました。\n" + err.message);
                loadReservations(); 
            }
        }

        async function deleteReservation(reservationId) {
            const confirmed = await showCustomConfirm("予約の削除確認", "本当にこの予約を削除しますか？", "削除する");
            if (!confirmed) return;

            try {
                await supabaseClient.from('reservation_items').delete().eq('reservation_id', reservationId);
                await supabaseClient.from('reservations').delete().eq('id', reservationId);
                loadReservations();
            } catch (err) {
                console.error(err);
                alert("削除に失敗しました。\n" + err.message);
                loadReservations();
            }
        }

        async function saveProduct(btnElement, productId, currentImageUrl) {
            const newName = document.getElementById(`name-${productId}`).value.trim();
            const newCategory = document.getElementById(`cat-${productId}`).value;
            const newStock = parseInt(document.getElementById(`stock-${productId}`).value, 10);
            const newIsActive = document.getElementById(`active-${productId}`).value === 'true';
            const newUnitsInput = document.getElementById(`units-${productId}`).value.trim();
            const imageFileInput = document.getElementById(`image-file-${productId}`);
            const newImageFile = imageFileInput.files[0];

            if (!newName || !newCategory || isNaN(newStock)) {
                alert("必須項目を正しく入力してください。");
                return;
            }

            try {
                let imageUrl = currentImageUrl;
                if (newImageFile) {
                    const fileExt = newImageFile.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    const { error: uploadError } = await supabaseClient.storage.from('product-images').upload(fileName, newImageFile);
                    if (uploadError) throw uploadError;
                    const { data: publicUrlData } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
                    imageUrl = publicUrlData.publicUrl;
                }

                const { error: productUpdateError } = await supabaseClient
                    .from('products')
                    .update({ name: newName, category: newCategory, total_stock: newStock, is_active: newIsActive, image_url: imageUrl })
                    .eq('id', productId);
                if (productUpdateError) throw productUpdateError;

                // 個体番号は全削除せず、差分だけ更新する。
                // これにより既存の product_units.id を維持し、予約済み unit_id との紐付けを壊さない。
                const normalizedUnitNumbers = [...new Set(
                    newUnitsInput
                        .split(',')
                        .map(u => u.trim())
                        .filter(u => u !== '')
                )];

                const { data: existingUnits, error: existingUnitsError } = await supabaseClient
                    .from('product_units')
                    .select('id, unit_number')
                    .eq('product_id', productId);
                if (existingUnitsError) throw existingUnitsError;

                const existingByNumber = new Map((existingUnits || []).map(u => [u.unit_number, u]));

                // 追加された個体番号だけINSERT
                const unitNumbersToAdd = normalizedUnitNumbers.filter(num => !existingByNumber.has(num));
                if (unitNumbersToAdd.length > 0) {
                    const unitRows = unitNumbersToAdd.map(uNum => ({ product_id: productId, unit_number: uNum }));
                    const { error: insertUnitsError } = await supabaseClient
                        .from('product_units')
                        .insert(unitRows);
                    if (insertUnitsError) throw insertUnitsError;
                }

                // 入力欄から削除された個体番号だけDELETE候補にする
                const unitsToDelete = (existingUnits || []).filter(u => !normalizedUnitNumbers.includes(u.unit_number));

                if (unitsToDelete.length > 0) {
                    const deleteCandidateIds = unitsToDelete.map(u => u.id);

                    // 過去を含む予約明細で使われている個体は削除しない
                    const { data: usedItems, error: usedItemsError } = await supabaseClient
                        .from('reservation_items')
                        .select('unit_id')
                        .in('unit_id', deleteCandidateIds);
                    if (usedItemsError) throw usedItemsError;

                    const usedUnitIds = new Set((usedItems || []).map(i => i.unit_id).filter(Boolean));
                    const safeDeleteIds = deleteCandidateIds.filter(id => !usedUnitIds.has(id));
                    const protectedUnits = unitsToDelete.filter(u => usedUnitIds.has(u.id));

                    if (safeDeleteIds.length > 0) {
                        const { error: deleteUnitsError } = await supabaseClient
                            .from('product_units')
                            .delete()
                            .in('id', safeDeleteIds);
                        if (deleteUnitsError) throw deleteUnitsError;
                    }

                    if (protectedUnits.length > 0) {
                        const protectedNames = protectedUnits.map(u => u.unit_number).join(', ');
                        alert(`以下の個体番号は予約履歴で使用されているため削除しませんでした。\n${protectedNames}`);
                    }
                }

                const originalText = btnElement.innerText;
                const originalBg = btnElement.style.backgroundColor;
                const originalColor = btnElement.style.color;

                btnElement.innerText = "保存しました！";
                btnElement.style.backgroundColor = "#16a34a";
                btnElement.style.color = "white";
                btnElement.disabled = true;

                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.backgroundColor = originalBg;
                    btnElement.style.color = originalColor;
                    btnElement.disabled = false;
                    loadProducts(); 
                }, 1200);

            } catch (err) {
                console.error(err);
                alert("更新に失敗しました。\n" + err.message);
            }
        }

        async function deleteProduct(productId) {
            const confirmed = await showCustomConfirm("商品の削除確認", "本当にこの商品を削除しますか？", "削除する");
            if (!confirmed) return;

            try {
                await supabaseClient.from('product_units').delete().eq('product_id', productId);
                await supabaseClient.from('products').delete().eq('id', productId);
                loadProducts();
            } catch (err) {
                console.error(err);
                alert("削除に失敗しました。\n" + err.message);
            }
        }

        document.getElementById('add-item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('product-name').value.trim();
            const category = document.getElementById('product-category').value;
            const totalStock = parseInt(document.getElementById('total-stock').value, 10);
            const unitInput = document.getElementById('unit-numbers').value.trim();
            const imageFile = document.getElementById('product-image').files[0];

            if (!name || !category || isNaN(totalStock)) {
                alert("必須項目を正しく入力・選択してください。");
                return;
            }

            try {
                let imageUrl = null;
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    const { error: uploadError } = await supabaseClient.storage.from('product-images').upload(fileName, imageFile);
                    if (uploadError) throw uploadError;
                    const { data: publicUrlData } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
                    imageUrl = publicUrlData.publicUrl;
                }

                const { data: insertedProduct, error: prodError } = await supabaseClient.from('products').insert([{ name: name, category: category, total_stock: totalStock, is_active: true, image_url: imageUrl }]).select().single();
                if (prodError) throw prodError;

                if (unitInput !== '') {
                    const unitNumbers = unitInput.split(',').map(u => u.trim()).filter(u => u !== '');
                    if (unitNumbers.length > 0) {
                        const unitRows = unitNumbers.map(uNum => ({ product_id: insertedProduct.id, unit_number: uNum }));
                        await supabaseClient.from('product_units').insert(unitRows);
                    }
                }

                alert(`新しいアイテム「${name}」を登録しました！`);
                document.getElementById('add-item-form').reset();
                document.getElementById('total-stock').value = "1";
                loadProducts();
            } catch (err) {
                console.error(err);
                alert("アイテムの登録に失敗しました。\n" + err.message);
            }
        });
    </script>
</body>
</html>
