<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>社内レンタル予約 | 管理画面</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .header { background-color: #333; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .back-link { color: white; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        
        .main-container { padding: 2rem; max-width: 1400px; margin: 0 auto; }
        
        /* タブ切り替えボタンのスタイル */
        .tab-menu { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .tab-btn { background-color: #e2e8f0; color: #475569; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background-color 0.2s, color 0.2s; }
        .tab-btn.active { background-color: #206c8c; color: white; }
        .tab-btn:hover { background-color: #cbd5e1; }
        .tab-btn.active:hover { background-color: #174d63; }

        /* セクションの表示切り替え */
        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .card { background-color: white; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 2rem; overflow-x: auto; margin-bottom: 2rem; }
        .card h2 { margin-top: 0; font-size: 1.2rem; color: #206c8c; border-bottom: 2px solid #f0f2f5; padding-bottom: 0.5rem; }
        
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: #f7f9fa; color: #206c8c; font-weight: bold; }
        
        select { padding: 0.4rem; border-radius: 0.4rem; border: 1px solid #ccc; font-family: inherit; cursor: pointer; margin-bottom: 0.5rem; display: block; width: 100%; }
        .status-yoyaku { background-color: #fff9c4; }
        .status-kashidashi { background-color: #c8e6c9; }
        .status-henkyaku { background-color: #e0e0e0; }
        
        .item-list { margin: 0; padding-left: 1.2rem; font-size: 0.9rem; }
        .item-list li { margin-bottom: 0.3rem; }
        .unit-number { color: #206c8c; font-weight: bold; font-size: 0.85rem; background-color: #e6f2f5; padding: 0.1rem 0.4rem; border-radius: 0.3rem; display: inline-block; margin-top: 0.1rem; }

        .action-btns { display: flex; gap: 0.5rem; }
        .edit-btn { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 0.4rem 0.8rem; border-radius: 0.4rem; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .edit-btn:hover { background-color: #bae6fd; }

        .delete-btn { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; padding: 0.4rem 0.8rem; border-radius: 0.4rem; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .delete-btn:hover { background-color: #ffcdd2; }

        /* 登録フォーム用のスタイル */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 0.3rem; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 0.4rem; font-family: inherit; box-sizing: border-box; background-color: #fff; }
        .form-group input[type="file"] { padding: 0.4rem; background-color: #f9f9f9; cursor: pointer; }
        .submit-btn { background-color: #206c8c; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.4rem; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #174d63; }

        .product-thumbnail { width: 50px; height: 50px; object-fit: cover; border-radius: 0.3rem; background-color: #eee; }
    </style>
</head>
<body>
    <div class="header">
        <h1>レンタル管理ダッシュボード</h1>
        <a href="index.html" class="back-link">トップページに戻る</a>
    </div>

    <div class="main-container">
        <!-- 切り替えタブボタン -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('reservations', this)">📋 予約一覧・管理</button>
            <button class="tab-btn" onclick="switchTab('products', this)">📦 商品一覧・新規追加</button>
        </div>

        <!-- ① 予約一覧セクション -->
        <div id="section-reservations" class="admin-section active">
            <div class="card">
                <h2>📋 予約・貸出管理一覧</h2>
                <table>
                    <thead>
                        <tr>
                            <th>申込日時</th>
                            <th>所属</th>
                            <th>氏名</th>
                            <th>予約商品 ＆ 個体番号</th>
                            <th>レンタル期間</th>
                            <th>メールアドレス</th>
                            <th>ステータス / 操作</th>
                        </tr>
                    </thead>
                    <tbody id="reservation-list">
                        <tr>
                            <td colspan="7" style="text-align: center;">データを読み込んでいます...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ② 商品一覧・新規追加セクション -->
        <div id="section-products" class="admin-section">
            <div class="card">
                <h2>➕ 新規レンタル品の追加（画像アップロード対応）</h2>
                <form id="add-item-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="product-name">商品名</label>
                            <input type="text" id="product-name" required placeholder="例: テント">
                        </div>
                        <div class="form-group">
                            <label for="product-category">カテゴリ</label>
                            <select id="product-category" required>
                                <option value="" disabled selected>選択してください</option>
                                <option value="スポーツ">スポーツ</option>
                                <option value="アウトドア">アウトドア</option>
                                <option value="トラベル">トラベル</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="total-stock">総在庫数 (数値)</label>
                            <input type="number" id="total-stock" required min="1" value="1">
                        </div>
                        <div class="form-group">
                            <label for="unit-numbers">個体番号（カンマ区切りで総在庫数分）</label>
                            <input type="text" id="unit-numbers" required placeholder="例: T-01, T-02">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="product-image">商品画像ファイル（任意）</label>
                            <input type="file" id="product-image" accept="image/*">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">この内容でアイテムを追加する</button>
                </form>
            </div>

            <div class="card">
                <h2>📦 登録済み商品一覧</h2>
                <table>
                    <thead>
                        <tr>
                            <th>画像</th>
                            <th>商品名</th>
                            <th>カテゴリ</th>
                            <th>総在庫数</th>
                            <th>個体番号一覧</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <tr>
                            <td colspan="6" style="text-align: center;">商品を読み込んでいます...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://byntbjxaozwrdexvdlwb.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_HA3bsshsYRxlyVJXjdjOGQ_Jhyuv-4S';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            loadReservations();
            loadProducts();
        });

        // タブ切り替え関数
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'reservations') {
                document.getElementById('section-reservations').classList.add('active');
            } else if (tabName === 'products') {
                document.getElementById('section-products').classList.add('active');
            }
            btnElement.classList.add('active');
        }

        async function loadReservations() {
            const tbody = document.getElementById('reservation-list');
            try {
                const { data: reservations, error: resError } = await supabaseClient
                    .from('reservations')
                    .select('*')
                    .order('id', { ascending: false });

                const { data: resItems, error: itemsError } = await supabaseClient
                    .from('reservation_items')
                    .select('*');

                const { data: products, error: prodError } = await supabaseClient
                    .from('products')
                    .select('*');

                const { data: units, error: unitError } = await supabaseClient
                    .from('product_units')
                    .select('*');

                if (resError) throw resError;
                if (itemsError) throw itemsError;
                if (prodError) throw prodError;
                if (unitError) throw unitError;

                if (!reservations || reservations.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">現在、予約はありません。</td></tr>';
                    return;
                }

                tbody.innerHTML = '';

                reservations.forEach(res => {
                    const tr = document.createElement('tr');
                    
                    const createdAt = res.created_at ? new Date(res.created_at).toLocaleString('ja-JP') : '不明';
                    const currentStatus = res.status || '予約中';

                    const myItems = resItems.filter(item => item.reservation_id === res.id);
                    
                    const itemsHtml = myItems.map(item => {
                        const product = products.find(p => p.id === item.product_id);
                        const productName = product ? product.name : '不明な商品';
                        
                        const unit = units.find(u => u.id === item.unit_id);
                        const unitNumberStr = unit ? `<br><span class="unit-number">個体: ${unit.unit_number}</span>` : '';

                        return `<li>${productName} (${item.quantity}個)${unitNumberStr}</li>`;
                    }).join('');

                    tr.innerHTML = `
                        <td style="font-size: 0.9rem; color: #666;">${createdAt}</td>
                        <td>${res.department}</td>
                        <td><strong>${res.user_name}</strong></td>
                        <td><ul class="item-list">${itemsHtml || '<li>商品データなし</li>'}</ul></td>
                        <td>${res.start_date} <br>〜 ${res.end_date}</td>
                        <td><a href="mailto:${res.email}" style="font-size: 0.9rem;">${res.email}</a></td>
                        <td>
                            <select onchange="updateStatus('${res.id}', this.value)" class="${getStatusClass(currentStatus)}">
                                <option value="予約中" ${currentStatus === '予約中' ? 'selected' : ''}>予約中</option>
                                <option value="貸出済" ${currentStatus === '貸出済' ? 'selected' : ''}>貸出済</option>
                                <option value="返却済" ${currentStatus === '返却済' ? 'selected' : ''}>返却済</option>
                                <option value="キャンセル" ${currentStatus === 'キャンセル' ? 'selected' : ''}>キャンセル</option>
                            </select>
                            <button onclick="deleteReservation('${res.id}')" class="delete-btn">予約を削除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">エラーが発生しました: ${err.message}</td></tr>`;
            }
        }

        async function loadProducts() {
            const tbody = document.getElementById('product-list');
            try {
                const { data: products, error: prodError } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('name');

                const { data: units, error: unitError } = await supabaseClient
                    .from('product_units')
                    .select('*');

                if (prodError) throw prodError;
                if (unitError) throw unitError;

                if (!products || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">登録されている商品はありません。</td></tr>';
                    return;
                }

                tbody.innerHTML = '';

                products.forEach(prod => {
                    const tr = document.createElement('tr');
                    
                    const imgHtml = prod.image_url 
                        ? `<img src="${prod.image_url}" class="product-thumbnail" alt="商品画像">` 
                        : '<span style="font-size:0.8rem; color:#999;">画像なし</span>';

                    const prodUnits = units.filter(u => u.product_id === prod.id);
                    const unitsHtml = prodUnits.length > 0 
                        ? prodUnits.map(u => `<span class="unit-number">${u.unit_number}</span>`).join(' ') 
                        : '<span style="color:#999;">個体なし</span>';

                    tr.innerHTML = `
                        <td>${imgHtml}</td>
                        <td><strong>${prod.name}</strong></td>
                        <td>${prod.category || '未分類'}</td>
                        <td>${prod.total_stock || prodUnits.length}個</td>
                        <td>${unitsHtml}</td>
                        <td>
                            <div class="action-btns">
                                <button onclick="editProduct('${prod.id}', '${prod.name}', '${prod.category || ''}', ${prod.total_stock || prodUnits.length})" class="edit-btn">編集</button>
                                <button onclick="deleteProduct('${prod.id}')" class="delete-btn">削除</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">エラーが発生しました: ${err.message}</td></tr>`;
            }
        }

        function getStatusClass(status) {
            if (status === '予約中') return 'status-yoyaku';
            if (status === '貸出済') return 'status-kashidashi';
            if (status === '返却済') return 'status-henkyaku';
            return '';
        }

        async function updateStatus(reservationId, newStatus) {
            try {
                const { error } = await supabaseClient
                    .from('reservations')
                    .update({ status: newStatus })
                    .eq('id', reservationId);

                if (error) throw error;
                alert(`ステータスを「${newStatus}」に更新しました。`);
                loadReservations(); 
            } catch (err) {
                console.error(err);
                alert("更新に失敗しました。\n" + err.message);
                loadReservations(); 
            }
        }

        async function deleteReservation(reservationId) {
            if (!confirm("本当にこの予約を削除しますか？\n削除すると、この期間の個体（在庫）が再び予約可能になります。")) return;

            try {
                const { error: itemError } = await supabaseClient.from('reservation_items').delete().eq('reservation_id', reservationId);
                if (itemError) throw itemError;

                const { error: resError } = await supabaseClient.from('reservations').delete().eq('id', reservationId);
                if (resError) throw resError;

                loadReservations();
            } catch (err) {
                console.error(err);
                alert("削除に失敗しました。\n" + err.message);
                loadReservations();
            }
        }

        // 商品の編集処理
        async function editProduct(productId, currentName, currentCategory, currentStock) {
            const newName = prompt("新しい商品名を入力してください:", currentName);
            if (newName === null) return; // キャンセルされた場合

            const categories = ["スポーツ", "アウトドア", "トラベル"];
            const newCategory = prompt(`カテゴリを選択してください（スポーツ / アウトドア / トラベル）:\n現在のカテゴリ: ${currentCategory}`, currentCategory);
            if (newCategory === null) return;
            if (!categories.includes(newCategory)) {
                alert("カテゴリは「スポーツ」「アウトドア」「トラベル」のいずれかで入力してください。");
                return;
            }

            const newStockStr = prompt("新しい総在庫数を入力してください:", currentStock);
            if (newStockStr === null) return;
            const newStock = parseInt(newStockStr, 10);
            if (isNaN(newStock) || newStock < 1) {
                alert("有効な在庫数（1以上の数値）を入力してください。");
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('products')
                    .update({
                        name: newName.trim(),
                        category: newCategory,
                        total_stock: newStock
                    })
                    .eq('id', productId);

                if (error) throw error;

                alert("商品情報を更新しました！");
                loadProducts();
            } catch (err) {
                console.error(err);
                alert("更新に失敗しました。\n" + err.message);
            }
        }

        // 商品の削除処理
        async function deleteProduct(productId) {
            if (!confirm("本当にこの商品を削除しますか？\n紐づく個体データも一緒に削除されます。")) return;

            try {
                // 1. 紐づく個体データの削除
                await supabaseClient.from('product_units').delete().eq('product_id', productId);
                // 2. 商品自体の削除
                const { error } = await supabaseClient.from('products').delete().eq('id', productId);
                if (error) throw error;

                alert("商品を削除しました。");
                loadProducts();
            } catch (err) {
                console.error(err);
                alert("削除に失敗しました。\n" + err.message);
            }
        }

        // 新規アイテム登録 ＆ 画像アップロードの処理
        document.getElementById('add-item-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('product-name').value.trim();
            const category = document.getElementById('product-category').value;
            const totalStock = parseInt(document.getElementById('total-stock').value, 10);
            const unitInput = document.getElementById('unit-numbers').value.trim();
            const imageFile = document.getElementById('product-image').files[0];

            if (!name || !category || isNaN(totalStock) || !unitInput) {
                alert("すべての必須項目を正しく入力・選択してください。");
                return;
            }

            try {
                let imageUrl = null;
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    
                    const { error: uploadError } = await supabaseClient.storage
                        .from('product-images')
                        .upload(fileName, imageFile);

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('product-images')
                        .getPublicUrl(fileName);

                    imageUrl = publicUrlData.publicUrl;
                }

                const { data: insertedProduct, error: prodError } = await supabaseClient
                    .from('products')
                    .insert([{ name: name, category: category, total_stock: totalStock, is_active: true, image_url: imageUrl }])
                    .select()
                    .single();

                if (prodError) throw prodError;

                const unitNumbers = unitInput.split(',').map(u => u.trim()).filter(u => u !== '');
                const unitRows = unitNumbers.map(uNum => ({ product_id: insertedProduct.id, unit_number: uNum }));

                const { error: unitError } = await supabaseClient.from('product_units').insert(unitRows);
                if (unitError) throw unitError;

                alert(`新しいアイテム「${name}」を登録しました！`);
                document.getElementById('add-item-form').reset();
                document.getElementById('total-stock').value = "1";
                
                loadProducts(); // リストを更新

            } catch (err) {
                console.error(err);
                alert("アイテムの登録に失敗しました。\n" + err.message);
            }
        });
    </script>
</body>
</html>
