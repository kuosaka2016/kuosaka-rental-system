<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社内レンタル予約 | 管理画面</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- QRコード読み取り用ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .header { background-color: #333; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .back-link { color: white; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        .main-container { padding: 2rem; max-width: 1400px; margin: 0 auto; }
        
        /* タブ切り替えボタン */
        .tab-menu { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .tab-btn { background-color: #e2e8f0; color: #475569; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background-color 0.2s, color 0.2s; }
        .tab-btn.active { background-color: #206c8c; color: white; }
        
        /* セクションの表示切り替え */
        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .card { background-color: white; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 2rem; margin-bottom: 2rem; overflow-x: auto; }
        h2 { margin-top: 0; color: #206c8c; font-size: 1.3rem; border-bottom: 2px solid #f0f2f5; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }

        /* QRスキャナーエリア */
        .scanner-container { background-color: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 1rem; padding: 1.5rem; text-align: center; margin-bottom: 1.5rem; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
        .scan-btn { background-color: #0f766e; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .scan-btn:hover { background-color: #115e59; }

        /* テーブル */
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 0.8rem 1rem; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #475569; font-weight: bold; }
        
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.85rem; font-weight: bold; display: inline-block; }
        .status-reserved { background-color: #fef3c7; color: #d97706; }
        .status-renting { background-color: #e0f2fe; color: #0284c7; }
        .status-returned { background-color: #dcfce7; color: #16a34a; }
        .status-cancelled { background-color: #fee2e2; color: #dc2626; }

        select { padding: 0.4rem; border-radius: 0.4rem; border: 1px solid #cbd5e1; font-family: inherit; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: bold; font-size: 0.85rem; margin-bottom: 0.3rem; color: #475569; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; box-sizing: border-box; }
        .submit-btn { background-color: #206c8c; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .submit-btn:hover { background-color: #174d63; }
    </style>
</head>
<body>

    <div class="header">
        <h1>社内レンタルシステム管理画面</h1>
        <a href="index.html" class="back-link">&larr; ユーザー画面へ戻る</a>
    </div>

    <div class="main-container">
        <!-- タブメニュー -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('reservations')">予約・貸出管理</button>
            <button class="tab-btn" onclick="switchTab('products')">商品・個体管理</button>
        </div>

        <!-- タブ1: 予約・貸出管理セクション -->
        <div id="section-reservations" class="admin-section active">
            
            <!-- カメラQRスキャナーボックス -->
            <div class="card">
                <h2>📷 QR/バーコードでステータス変更</h2>
                <div class="scanner-container">
                    <p style="margin-top:0; font-size: 0.9rem; color: #64748b;">個体（unit_id または 予約ID）のQRコードをカメラで読み取ると、ステータスを自動更新できます。</p>
                    <button class="scan-btn" id="start-scan-btn" onclick="toggleScanner()">スキャナーを起動する</button>
                    <div id="reader"></div>
                </div>
            </div>

            <div class="card">
                <h2>予約・貸出一覧</h2>
                <div id="reservations-table-container">
                    <p>データを読み込んでいます...</p>
                </div>
            </div>
        </div>

        <!-- タブ2: 商品・個体管理セクション -->
        <div id="section-products" class="admin-section">
            <div class="card">
                <h2>新規商品登録</h2>
                <form id="product-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="p-name">商品名</label>
                            <input type="text" id="p-name" required placeholder="例: モバイルプロジェクター">
                        </div>
                        <div class="form-group">
                            <label for="p-category">カテゴリ</label>
                            <select id="p-category" required>
                                <option value="トラベル">トラベル</option>
                                <option value="スポーツ">スポーツ</option>
                                <option value="アウトドア">アウトドア</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="p-stock">総個体数（固有IDを自動生成します）</label>
                            <input type="number" id="p-stock" min="1" value="1" required>
                        </div>
                        <div class="form-group">
                            <label for="p-image">画像URL (任意)</label>
                            <input type="url" id="p-image" placeholder="https://...">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="p-submit-btn">商品を登録する</button>
                </form>
            </div>

            <div class="card">
                <h2>登録済み商品・個体一覧</h2>
                <div id="products-table-container">
                    <p>データを読み込んでいます...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://byntbjxaozwrdexvdlwb.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_HA3bsshsYRxlyVJXjdjOGQ_Jhyuv-4S';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let html5QrCode = null;
        let isScannerRunning = false;

        window.addEventListener('DOMContentLoaded', () => {
            loadReservations();
            loadProductsManagement();
        });

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));

            if (tabName === 'reservations') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('section-reservations').classList.add('active');
                loadReservations();
                if (isScannerRunning) stopScanner(); // タブ切り替え時はスキャナーを停止
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('section-products').classList.add('active');
                loadProductsManagement();
                if (isScannerRunning) stopScanner();
            }
        }

        // ==========================================
        // 1. QRスキャナー機能
        // ==========================================
        function toggleScanner() {
            if (!isScannerRunning) {
                startScanner();
            } else {
                stopScanner();
            }
        }

        function startScanner() {
            const readerDiv = document.getElementById('reader');
            readerDiv.style.display = 'block';
            document.getElementById('start-scan-btn').innerText = 'スキャナーを停止する';
            document.getElementById('start-scan-btn').style.backgroundColor = '#dc2626';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, // 背面カメラを使用
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    // QRコードが読み取られたときの処理
                    // 読み取ったテキスト（例: 予約ID または 個体ID）を元に対応を決定
                    await handleScannedCode(decodedText.trim());
                },
                (errorMessage) => {
                    // 読み取り中のエラー（スキャン範囲内に対象がない場合などは頻繁に出るため無視してOK）
                }
            ).catch(err => {
                alert("カメラの起動に失敗しました。カメラの権限を確認してください。\n" + err);
                stopScanner();
            });

            isScannerRunning = true;
        }

        function stopScanner() {
            if (html5QrCode && isScannerRunning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('start-scan-btn').innerText = 'スキャナーを起動する';
                    document.getElementById('start-scan-btn').style.backgroundColor = '#0f766e';
                    isScannerRunning = false;
                }).catch(err => {
                    console.error("スキャナー停止エラー", err);
                });
            }
        }

        // スキャンされたコードを基にステータスを進めるロジック
        async function handleScannedCode(codeText) {
            // 例: codeText が 「予約ID」または「個体ID(unit_id)」であると仮定
            // まずは「予約ID」として一致するものがあるか確認
            let { data: resData, error: resErr } = await supabaseClient
                .from('reservations')
                .select('*')
                .eq('id', codeText)
                .single();

            if (resData) {
                // 予約が見つかった場合：ステータスを次の段階へ進める（予約中 -> 貸出中 -> 返却済）
                let nextStatus = '';
                if (resData.status === '予約中') nextStatus = '貸出中';
                else if (resData.status === '貸出中') nextStatus = '返却済';
                else {
                    alert(`この予約（ID: ${codeText.slice(0,8)}...）はすでに「${resData.status}」です。`);
                    return;
                }

                if (confirm(`【予約検出】\n利用者: ${resData.user_name} (${resData.department})\n現在の状態: ${resData.status}\n\nステータスを「${nextStatus}」に変更しますか？`)) {
                    await updateReservationStatusDirect(resData.id, nextStatus);
                }
                return;
            }

            // 次に「個体ID (unit_id)」から、現在貸出中/予約中の該当アイテムを探すアプローチ
            let { data: itemData, error: itemErr } = await supabaseClient
                .from('reservation_items')
                .select('reservation_id')
                .eq('unit_id', codeText);

            if (itemData && itemData.length > 0) {
                // この個体に紐づく最新の有効な予約を取得
                const resIds = itemData.map(i => i.reservation_id);
                let { data: activeRes, error: actErr } = await supabaseClient
                    .from('reservations')
                    .select('*')
                    .in('id', resIds)
                    .not('status', 'in', '("キャンセル","返却済")')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (activeRes && activeRes.length > 0) {
                    const target = activeRes[0];
                    let nextStatus = target.status === '予約中' ? '貸出中' : '返却済';

                    if (confirm(`【個別アイテム検出】\n個体ID: ${codeText.slice(0,8)}...\n利用者: ${target.user_name}\n\nステータスを「${nextStatus}」に変更しますか？`)) {
                        await updateReservationStatusDirect(target.id, nextStatus);
                    }
                    return;
                }
            }

            alert(`読み取ったコード（${codeText}）に一致する有効な予約が見つかりませんでした。`);
        }

        async function updateReservationStatusDirect(resId, newStatus) {
            const { error } = await supabaseClient
                .from('reservations')
                .update({ status: newStatus })
                .eq('id', resId);

            if (error) {
                alert("ステータスの更新に失敗しました: " + error.message);
            } else {
                alert(`ステータスを「${newStatus}」に更新しました！`);
                loadReservations();
            }
        }


        // ==========================================
        // 2. 予約・貸出管理の描画と通常変更
        // ==========================================
        async function loadReservations() {
            const container = document.getElementById('reservations-table-container');
            container.innerHTML = '<p>読み込み中...</p>';

            try {
                const { data: reservations, error } = await supabaseClient
                    .from('reservations')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!reservations || reservations.length === 0) {
                    container.innerHTML = '<p>予約データがありません。</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>期間</th>
                                <th>所属・氏名</th>
                                <th>ステータス</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                reservations.forEach(res => {
                    let badgeClass = 'status-reserved';
                    if (res.status === '貸出中') badgeClass = 'status-renting';
                    else if (res.status === '返却済') badgeClass = 'status-returned';
                    else if (res.status === 'キャンセル') badgeClass = 'status-cancelled';

                    html += `
                        <tr>
                            <td>${res.start_date} 〜 ${res.end_date}</td>
                            <td><strong>${res.department}</strong><br>${res.user_name}</td>
                            <td><span class="status-badge ${badgeClass}">${res.status}</span></td>
                            <td>
                                <select onchange="updateStatus('${res.id}', this.value)">
                                    <option value="予約中" ${res.status === '予約中' ? 'selected' : ''}>予約中</option>
                                    <option value="貸出中" ${res.status === '貸出中' ? 'selected' : ''}>貸出中</option>
                                    <option value="返却済" ${res.status === '返却済' ? 'selected' : ''}>返却済</option>
                                    <option value="キャンセル" ${res.status === 'キャンセル' ? 'selected' : ''}>キャンセル</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:red;">データの読み込みに失敗しました: ${err.message}</p>`;
            }
        }

        async function updateStatus(resId, newStatus) {
            const { error } = await supabaseClient
                .from('reservations')
                .update({ status: newStatus })
                .eq('id', resId);

            if (error) {
                alert("更新に失敗しました: " + error.message);
            } else {
                loadReservations(); // 再描画
            }
        }


        // ==========================================
        // 3. 商品・個体管理
        // ==========================================
        async function loadProductsManagement() {
            const container = document.getElementById('products-table-container');
            container.innerHTML = '<p>読み込み中...</p>';

            try {
                const { data: products, error: prodErr } = await supabaseClient.from('products').select('*').order('name');
                const { data: units, error: unitErr } = await supabaseClient.from('product_units').select('*');

                if (prodErr || unitErr) throw (prodErr || unitErr);

                if (!products || products.length === 0) {
                    container.innerHTML = '<p>商品が登録されていません。</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>商品名</th>
                                <th>カテゴリ</th>
                                <th>個体数 (ユニット)</th>
                                <th>アクション</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                products.forEach(p => {
                    const pUnits = units.filter(u => u.product_id === p.id);
                    html += `
                        <tr>
                            <td><strong>${p.name}</strong></td>
                            <td>${p.category}</td>
                            <td>${pUnits.length} 個</td>
                            <td>
                                <button onclick="toggleProductActive('${p.id}', ${!p.is_active})" style="padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer;">
                                    ${p.is_active ? '無効化する' : '有効化する'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:red;">商品データの読み込みに失敗しました: ${err.message}</p>`;
            }
        }

        // 商品新規登録
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value.trim();
            const category = document.getElementById('p-category').value;
            const stock = parseInt(document.getElementById('p-stock').value);
            const imageUrl = document.getElementById('p-image').value.trim();

            const submitBtn = document.getElementById('p-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "登録中...";

            try {
                // 1. products テーブルに登録
                const { data: prodData, error: prodErr } = await supabaseClient
                    .from('products')
                    .insert([{ name, category, image_url: imageUrl || null, is_active: true }])
                    .select()
                    .single();

                if (prodErr) throw prodErr;
                const productId = prodData.id;

                // 2. 指定された個数分 product_units (個体) を自動生成
                let unitsToInsert = [];
                for (let i = 0; i < stock; i++) {
                    unitsToInsert.push({ product_id: productId });
                }

                const { error: unitErr } = await supabaseClient
                    .from('product_units')
                    .insert(unitsToInsert);

                if (unitErr) throw unitErr;

                alert("商品を登録し、個体ユニットを生成しました！");
                document.getElementById('product-form').reset();
                loadProductsManagement();

            } catch (err) {
                console.error(err);
                alert("登録エラー: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "商品を登録する";
            }
        });

        async function toggleProductActive(productId, newStatus) {
            const { error } = await supabaseClient
                .from('products')
                .update({ is_active: newStatus })
                .eq('id', productId);

            if (error) {
                alert("更新エラー: " + error.message);
            } else {
                loadProductsManagement();
            }
        }
    </script>
</body>
</html>
