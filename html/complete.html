<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社内レンタル予約 | 予約完了</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f7f9fa; color: #333; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; }
        .card { background-color: #ffffff; width: 100%; max-width: 500px; padding: 2.5rem; border-radius: 1.5rem; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        h1 { font-size: 1.8rem; color: #206c8c; margin-bottom: 1rem; }
        p { font-size: 1rem; line-height: 1.6; color: #555; margin-bottom: 1.5rem; }
        .alert-box { background-color: #fff9c4; border: 1px solid #fbc02d; padding: 1rem; border-radius: 0.8rem; font-size: 0.9rem; font-weight: bold; color: #d84315; margin-bottom: 2rem; }
        .top-button { background-color: #206c8c; color: white; text-decoration: none; padding: 0.8rem 2rem; border-radius: 2rem; font-size: 1rem; font-weight: bold; display: inline-block; transition: background-color 0.2s; }
        .top-button:hover { background-color: #174f67; }
    </style>
</head>
<body>
    <div class="card">
        <h1>予約が完了しました！</h1>
        <p>ご予約ありがとうございます。データの登録が正常に完了しました。</p>
        
        <div class="alert-box">
            ⚠️ 予約完了メールは送信されません。必要に応じでスクリーンショットなどで保管してください。
        </div>

        <a href="index.html" class="top-button">トップページに戻る</a>
    </div>
</body>
</html>
